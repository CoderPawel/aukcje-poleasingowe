name: Aktualizacja danych i publikacja strony

on:
  schedule:
    # Every 4 hours (UTC).
    - cron: '17 */4 * * *'
  workflow_dispatch:
    inputs:
      only:
        description: 'Uruchom tylko wybrane źródła (np. cararena,efl) – puste = wszystkie'
        required: false
        default: ''
  push:
    branches: [main]
    paths-ignore:
      - 'site/data/**'
      - '**.md'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-and-deploy
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Testy
        run: npm test

      - name: Pobierz oferty z portali aukcyjnych
        # A failing portal must not block publishing the others.
        continue-on-error: true
        env:
          ONLY: ${{ github.event.inputs.only }}
        run: |
          if [ -n "$ONLY" ]; then
            node scraper/index.mjs --only "$ONLY"
          else
            node scraper/index.mjs
          fi

      - name: Zapisz dane w repozytorium
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data
          if git diff --cached --quiet; then
            echo "Brak zmian w danych"
          else
            git commit -m "Aktualizacja ofert: $(date -u +'%Y-%m-%d %H:%M') UTC"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
            git push
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: scrape
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
